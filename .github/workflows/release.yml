name: Release sjskills
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing sjskills-vX.Y.Z tag to verify
        type: string
        required: true
      publish:
        description: Publish the verified release (irreversible)
        type: boolean
        default: false
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      publish:
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: sjskills-release-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  artifacts:
    uses: ./.github/workflows/release-artifacts.yml
    with:
      ref: ${{ inputs.tag }}
      tag: ${{ inputs.tag }}
  publish:
    if: inputs.publish && github.ref == 'refs/heads/main'
    needs: artifacts
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sjskills-release
          path: .tmp/release
      - name: Publish verified immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: python3 scripts/publish-release.py --tag "$RELEASE_TAG" --output .tmp/release
