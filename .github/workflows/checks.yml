name: Checks
on:
  pull_request:
    branches: [dev, main]
  merge_group:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    outputs:
      native: ${{ (github.event_name == 'pull_request' && github.base_ref == 'main') || (github.event_name == 'merge_group' && github.event.merge_group.base_ref == 'refs/heads/main') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.5'
      - name: Source checks
        run: |
          go vet ./...
          python3 scripts/release_test.py
          node --test scripts/lib/skill-registry.test.js scripts/audit-global-skills.test.js
          scripts/validate-skills
  artifacts:
    needs: source
    if: needs.source.outputs.native == 'true'
    uses: ./.github/workflows/release-artifacts.yml
  required:
    if: always()
    needs: [source, artifacts]
    runs-on: ubuntu-24.04
    steps:
      - env:
          SOURCE: ${{ needs.source.result }}
          ARTIFACTS: ${{ needs.artifacts.result }}
          NATIVE: ${{ needs.source.outputs.native }}
        run: |
          [[ "$SOURCE" == success ]]
          if [[ "$NATIVE" == true ]]; then [[ "$ARTIFACTS" == success ]]; fi
